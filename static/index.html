function render(){if(!S)return;let fn={home:homeView,practice:practiceView,ranking:rankView,city:cityView,profile:profileView,news:newsView}[page];$('#view').innerHTML=fn();wire();if(page==='city'){mountCity3D();if(!$('.city-stage')?.classList.contains('is-rendered'))requestAnimationFrame(drawCityIcons)}}
function authPrompt(){ $('#auth').classList.remove('hidden');authMode='register';authDraw() }function authDraw(){let reg=authMode==='register';$('#authTitle').textContent=reg?'アカウントをつくる':'ログインする';['nameField','ageField','guardianField','termsField'].forEach(id=>$('#'+id).classList.toggle('hidden',!reg));$('#authSubmit').textContent=reg?'登録してはじめる':'ログイン';$('#authSwitch').textContent=reg?'すでにアカウントがある → ログイン':'はじめての方 → アカウント登録';$('#authError').textContent='';$('#password').autocomplete=reg?'new-password':'current-password'}$('#authClose').onclick=()=>$('#auth').classList.add('hidden');$('#authSwitch').onclick=()=>{authMode=authMode==='register'?'login':'register';authDraw()};$('#authSubmit').onclick=async()=>{try{let reg=authMode==='register';await api(reg?'/api/register':'/api/login',reg?{login:$('#login').value,password:$('#password').value,name:$('#newName').value,ageBand:$('#newAge').value,guardian:$('#guardian').checked,terms:$('#terms').checked}:{login:$('#login').value,password:$('#password').value});$('#auth').classList.add('hidden');await load()}catch(e){$('#authError').textContent=e.message}};
function needAccount(){if(!S.me){authPrompt();return false}return true}
function homeView(){let me=S.me;let topics=['宅建業法','権利関係','法令上の制限','税・その他'];return hero('YOUR STUDY DASHBOARD','学ぶほど、街が育つ。','問題を解いて知識と街を積み上げよう。')+`<div class="grid3"><div class="card metric"><label>RANK POINTS</label><b>${me?.points??0}</b><small>初回正解で加算</small></div><div class="card metric"><label>ANSWERED</label><b>${S.answered}</b><small>累計回答</small></div><div class="card metric"><label>CITY COINS</label><b>${me?.coins??0} ◈</b><small>建物と交換</small></div></div><div class="split"><section class="card panel hero"><div class="kicker" style="color:#bce075">TODAY'S MISSION</div><h3>弱点を一つずつ。<br>今日の10問をはじめよう。</h3><p>正解して街のコインを集め、建物を置こう。間違えた問題はいつでも復習できます。</p><button class="button" id="startToday">今日の10問を解く →</button></section><section class="card panel"><h3>分野別の進捗</h3>${topics.map(t=>{let arr=S.questions.filter(q=>q.topic===t),done=arr.filter(q=>S.attempts[q.id]!==undefined),right=done.filter(q=>S.attempts[q.id]);return `<div class="row line"><span>${t}</span><span class="muted">${right.length}/${arr.length} 正解</span></div>`}).join('')}</section></div><div class="live-feed"><b>● LIVE</b><span id="liveText">${S.online} 人が直近5分以内に学習中</span></div><div class="notice">学習ランキング・街の公開は、それぞれプロフィールで選べます。年齢やログインIDは公開されません。</div>`}
function practiceView(){return hero('PRACTICE LAB','問題演習','分野・難易度・形式・出題元を組み合わせて、自分だけの演習をつくろう。')+`<section class="card filters"><div class="formgrid"><div class="field"><label>出題元</label><select id="origin"><option value="">すべて</option><option>オリジナル予想</option><option>過去問テーマ</option></select></div><div class="field"><label>分野</label><select id="topic"><option value="">全分野</option>${['宅建業法','権利関係','法令上の制限','税・その他'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>難易度</label><select id="difficulty"><option value="">すべて</option>${['初級','中級','上級'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>問題形式</label><select id="format"><option value="">すべて</option>${['四肢択一','正しいものをすべて','誤りをすべて'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="filter-actions"><label class="check"><input type="checkbox" id="wrongOnly">間違えた問題だけを復習</label><button class="button dark" id="startFiltered">この条件で始める →</button></div><p class="hint" style="margin-bottom:0">過去問テーマは公式試験の論点を独自に再構成した問題です。<a href="${S.pastSource}" target="_blank" rel="noopener noreferrer">公式の過去問と正解番号はこちら ↗</a></p></section><div id="exercise">${S.me?'<div class="empty">条件を選んで演習を始めてください。</div>':'<div class="notice">回答とスコアの保存にはアカウントが必要です。<button class="linkbtn" id="join">無料で登録 →</button></div>'}</div>`}
function startQuestions(today=false){if(!needAccount())return;let qs=S.questions.filter(q=>today||(!$('#origin').value||q.origin===$('#origin').value)&&(!$('#topic').value||q.topic===$('#topic').value)&&(!$('#difficulty').value||q.difficulty===$('#difficulty').value)&&(!$('#format').value||q.format===$('#format').value)&&(!$('#wrongOnly').checked||S.attempts[q.id]===false));if(today){let wrong=qs.filter(q=>S.attempts[q.id]===false),unseen=qs.filter(q=>S.attempts[q.id]===undefined),done=qs.filter(q=>S.attempts[q.id]===true);qs=[...wrong,...unseen,...done].slice(0,10)}qList=qs;qIndex=0;selected=[];result=null;if(today){nav('practice');$('#exercise').scrollIntoView({behavior:'smooth'})}renderQuestion()}
function renderQuestion(){let container=$('#exercise');let q=qList[qIndex];if(!q){container.innerHTML=`<div class="card panel" style="margin-top:16px"><h3>${qList.length?'セット完了！':'該当する問題がありません'}</h3><p class="muted">${qList.length?'お疲れさまでした。間違えた問題を復習して、次の街づくりに進もう。':'条件を広げて、もう一度検索してください。'}</p><button class="button" id="resetQ">条件を選び直す</button></div>`;$('#resetQ').onclick=()=>container.innerHTML='<div class="empty">条件を選んで演習を始めてください。</div>';return}container.innerHTML=`<div class="card question-wrap"><div class="qhead"><div class="tags"><span class="tag">${esc(q.topic)}</span><span class="tag">${esc(q.difficulty)}</span><span class="tag">${esc(q.format)}</span><span class="tag">${esc(q.origin)}</span></div><span class="hint">${qIndex+1} / ${qList.length}</span></div><h2 class="qtitle">${esc(q.question)}</h2><p class="hint">${q.format==='四肢択一'?'一つ選んでください':'当てはまるものをすべて選び、回答を確定してください'}</p><div class="answers">${q.choices.map((x,i)=>`<button class="option" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div><div id="qFeedback"></div><div style="margin-top:17px" id="qControls"><button class="button dark" id="confirmQ">回答を確定する</button></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(result)return;let i=Number(b.dataset.answer);selected=q.format==='四肢択一'?[i]:selected.includes(i)?selected.filter(v=>v!==i):[...selected,i];document.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',selected.includes(Number(o.dataset.answer))))});$('#confirmQ').onclick=submitAnswer}
async function submitAnswer(){if(!selected.length)return;let q=qList[qIndex];$('#confirmQ').disabled=true;try{result=await api('/api/answer',{id:q.id,choices:selected});document.querySelectorAll('.option').forEach(b=>{let i=Number(b.dataset.answer);b.disabled=true;b.classList.toggle('right',result.answer.includes(i));b.classList.toggle('wrong',selected.includes(i)&&!result.answer.includes(i))});$('#qFeedback').innerHTML=`<div class="feedback"><strong>${result.correct?'正解！':'もう一度整理しよう'} ${result.earned?`＋${result.earned} pt / ＋${result.coins} ◈`:''}${result.xp?` / 街EXP＋${result.xp}`:''}</strong><p>${esc(result.explanation)}</p><span class="hint">根拠：${esc(result.source)}${!result.first?' ／ 再回答はランキング点の対象外':''}</span></div>`;$('#qControls').innerHTML='<button class="button dark" id="nextQ">次の問題 →</button>';$('#nextQ').onclick=()=>{qIndex++;selected=[];result=null;renderQuestion()};await refreshQuiet()}catch(e){$('#qFeedback').innerHTML=`<p class="alert">${esc(e.message)}</p>`;$('#confirmQ').disabled=false}}
async function refreshQuiet(){let next=await api('/api/state');S=next;$('#headUser').textContent=S.me.avatar+' '+S.me.displayName;$('#online').textContent=S.online}
function rankView(){return hero('THE LEADERBOARD','全国で、県で、競い合おう。','順位は各問題の初回正解で決まります。復習は何度でもできます。')+`<div class="ranktabs"><button data-scope="national" class="${rankScope==='national'?'on':''}">全国</button><button data-scope="prefecture" class="${rankScope==='prefecture'?'on':''}">県別</button><button data-scope="weekly" class="${rankScope==='weekly'?'on':''}">直近7日</button></div><div class="card panel" id="rankList"><div class="empty">読み込み中…</div></div><div class="notice">ランキングの公開は任意です。県別の順位には都道府県と公開設定が必要です。自己申告の属性や年齢で本人を特定する表示はしません。</div>`}
async function loadRanks(){try{let r=await api('/api/rankings?scope='+rankScope);$('#rankList').innerHTML=r.rows.length?r.rows.map((u,i)=>`<div class="rankrow ${u.id===r.meId?'mine':''}"><strong>${i+1}</strong><span class="avatar">${esc(u.avatar)}</span><span><b>${esc(u.display_name)}</b><small>${esc(u.prefecture||'全国')} ${esc(u.role==='未設定'?'':u.role)}</small></span><strong>${u.score} pt</strong></div>`).join(''):`<div class="empty">${esc(r.message||'まだ参加者がいません。最初の一人になろう！')}</div>`}catch(e){$('#rankList').innerHTML='<div class="empty">読み込みに失敗しました。</div>'}}
function mountCity3D(){let stage=$('.city-stage');if(!stage||!window.City3D)return;let me=S.me,other=cityData&&(!me||cityData.owner.id!==me.id),owner=other?cityData.owner:me;
  try{City3D.mount(stage,owner,other?cityData.buildings:S.buildings,other?cityData.plots:S.plots,S.items,me&&!other?build:null,cityTurn,cityTilt)}catch(e){console.error('City 3D fallback',e)}}
function drawCityIcons(){let stage=$('.city-stage');if(!stage)return;stage.querySelectorAll('.city-stand').forEach(x=>x.remove());let box=stage.getBoundingClientRect();stage.querySelectorAll('.plot .structure').forEach(el=>{let plot=el.closest('.plot'),item=S.items[el.classList[1]],rect=plot.getBoundingClientRect();if(!item)return;let sign=document.createElement('span');sign.className='city-stand';sign.textContent=item.icon;sign.style.left=(rect.left+rect.width/2-box.left)+'px';sign.style.top=(rect.top+rect.height/2-box.top)+'px';stage.appendChild(sign)})}
function cityScene(buildings,canBuild,label,owner,plots){let slots=owner?.citySlots||12;let tiles=Array.from({length:slots},(_,i)=>{let b=buildings.find(x=>x.tile===i),item=b&&S.items[b.item],event=(plots||[]).find(x=>x.tile===i),blocked=event&&event.hazard!=='clear'&&!(event.hazard==='survey'&&new Date(event.ready_at)<=new Date());let marker=blocked?(event.hazard==='underground'?'⚠️':'🏺'):'＋';return `<div role="button" tabindex="${canBuild?0:-1}" class="plot ${blocked?'plot-blocked':''}" data-tile="${i}" aria-label="${item?esc(item.name):blocked?'調査が必要な区画':'空き区画 '+(i+1)}" ${!canBuild?'aria-disabled="true"':''}>${b?`<span class="structure ${esc(b.item)} style-${S.styles.indexOf(b.style)}" style="--height:${Math.min(140,(b.item==='tower'?98:b.item==='apartment'?70:38)+((b.floors||1)-1)*12)}px" aria-hidden="true"><span class="roof"></span><span class="front"></span><span class="side"></span><span class="building-icon">${esc(item.icon)}</span><span class="floor-badge">${b.floors>1?b.floors+'F':''}</span></span>`:`<span class="empty-mark">${marker}</span>`}</div>`}).join('');return `<div class="city-stage road-${ROADC[owner?.roadStyle]||'soil'} ${owner?.sidewalk?'with-sidewalk':''}" style="min-height:${Math.max(420,Math.ceil(slots/4)*92+110)}px"><canvas class="city-canvas" aria-label="回転・拡大できる立体の街"></canvas><div class="city-sun"></div><div class="city-ground" id="cityGround" style="--turn:${cityTurn}deg;--tilt:${cityTilt}deg;--rows:${Math.ceil(slots/4)}">${tiles}</div><span class="city-caption">${esc(label)} · ${buildings.length}/${slots} 区画</span></div><div class="city-controls"><button data-camera="left">↶ 左へ</button><button data-camera="right">↷ 右へ</button><button data-camera="up">視点 ↑</button><button data-camera="reset">視点を戻す</button><button data-camera="night">🌙 夜景</button><button data-camera="fullscreen">⛶ 全画面</button><span class="hint">ドラッグで回転・ホイールで拡大 / ボタンでも操作できます</span></div>`}
const ROADC={'土の道':'soil','アスファルト':'asphalt','石畳':'stone','レンガ':'brick'};
function nextTierLevel(n){return [10,20,30,40,50,70,90,99].find(x=>x>n)||99}
function cityView(){let me=S.me,other=cityData&&(!me||cityData.owner.id!==me.id),owner=other?cityData.owner:me,buildings=other?cityData.buildings:S.buildings,plots=other?cityData.plots:S.plots,points=other?cityData.cityPoints:S.cityPoints,slots=owner?.citySlots||12;return hero('CITY DEVELOPMENT',other?`${esc(owner.displayName)}さんの街`:'学んで、街を育てよう。',other?'みんなの学習が生んだ街を見学中。':'正解で集めたコインを使って、建築・改築・街の拡張を楽しもう。')+`<div class="grid3" style="margin-bottom:16px"><div class="card metric"><label>街スコア</label><b>${points}</b><small>建物の価値と種類</small></div><div class="card metric"><label>街レベル</label><b>Lv.${other?cityData.cityLevel:S.cityLevel}</b><small>${esc(other?cityData.cityTier:S.cityTier)} · ${slots}区画 · 建物${buildings.length}棟</small></div><div class="card metric"><label>${other?'所有者':'建築用コイン'}</label><b>${other?esc(owner.avatar):`${me?.testBuilder?'∞':me?.coins??0} ◈`}</b><small>${other?esc(owner.prefecture||'全国'):'初回正解で獲得'}</small></div></div><div class="city-layout"><div class="card panel"><div class="row"><h3>${other?esc(owner.avatar)+' '+esc(owner.displayName)+'さんの街':'あなたの街 🏡'}</h3>${other?'<button class="button ghost small" id="myCity">自分の街へ</button>':''}</div><div class="tier-banner"><strong>${esc(other?cityData.cityTier:S.cityTier)}</strong><span>Lv.${other?cityData.cityLevel:S.cityLevel} · 次の発展段階まで ${Math.max(0,nextTierLevel(other?cityData.cityLevel:S.cityLevel)-(other?cityData.cityLevel:S.cityLevel))} レベル</span></div>${cityScene(buildings,!!me&&!other,other?owner.displayName:'MY CITY',owner,plots)}<p class="hint">${other?'街を回して見学できます。':'空き区画を押して建築。建物を押すと増築・改築・解体ができます。⚠️ は撤去、🏺 は調査が必要です。'}</p></div><div class="card panel">${other||!me?'<h3>街の見どころ</h3><p class="muted">街の建物を見ながら、次の勉強の目標を見つけよう。</p>':`<h3>建築ショップ</h3>${Object.entries(S.items).map(([key,it])=>`<div class="shop-item"><span style="font-size:20px">${esc(it.icon)}</span><b>${esc(it.name)}</b><span>${it.cost} ◈</span><button class="button small ${chosenItem===key?'':'ghost'}" data-item="${key}">選択</button></div>`).join('')}<div class="development"><h3>街の整備</h3><button class="button small ghost" data-action="expand" ${slots>=24?'disabled':''}>敷地 +4 区画 · ${12+(slots-12)/4*8} ◈</button><div class="field"><label>道路の舗装</label><select id="roadStyle">${Object.entries(S.roads).map(([x,c])=>`<option value="${x}" ${x===owner.roadStyle?'selected':''}>${x} · ${c} ◈</option>`).join('')}</select></div><button class="button small ghost" data-action="road">道路を整備</button> <button class="button small ghost" data-action="sidewalk" ${owner.sidewalk?'disabled':''}>歩道 · 10 ◈</button></div>`}<p class="alert" id="cityError"></p></div></div><div class="card panel" style="margin-top:16px"><h3>発展段階</h3><div class="tier-list">村 1–9 → 町 10–19 → 市 20–29 → 中核都市 30–39 → 大都市 40–49 → メガシティ 50–69 → 世界都市 70–89 → 未来都市 90–98 → グローバル都市 99</div></div><div class="card panel" style="margin-top:16px"><h3>🌐 グローバルタウン · Lv.99で解放</h3><p class="muted" style="font-size:12px;line-height:1.8">街レベル99から参加できる、仮想コインだけのオンライン不動産市場を構想中。プレイヤー間売買、仲介、競売、底地、滞納イベントなどを段階的に追加します。現時点では取引できません。</p><div class="level-track"><span style="width:${Math.min(100,(other?1:S.cityLevel)/99*100)}%"></span></div></div><div class="split"><section class="card panel"><div class="row"><h3>🏆 街ランキング</h3><span class="hint">建物の価値＋種類＋区画数</span></div><div id="cityLeaderboard"><div class="empty">読み込み中…</div></div></section><section class="card panel"><h3>みんなの街を見に行く</h3><p class="muted" style="font-size:12px;line-height:1.8">公開を選んだ街だけが表示されます。</p><div id="cityUpdates" class="hint">建築ニュースを読み込み中…</div></section></div>${!me?'<div class="notice">街づくりには登録が必要です。<button class="linkbtn" id="join">無料で登録 →</button></div>':''}`}
async function loadCities(){try{let r=await api('/api/cities');let el=$('#cityLeaderboard');if(!el)return;el.innerHTML=r.cities.length?r.cities.map((c,i)=>`<button class="city-rank" data-visit="${c.id}"><b>${i+1}</b><span style="font-size:23px">${esc(c.avatar)}</span><span><b>${esc(c.displayName)}</b><small>${esc(c.prefecture||'全国')} · ${c.buildingCount} 棟</small></span><b>${c.cityPoints} pt</b></button>`).join(''):'<div class="empty">公開されている街はまだありません。最初の街を公開しよう！</div>';document.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visitCity(Number(b.dataset.visit)))}catch(e){let el=$('#cityLeaderboard');if(el)el.innerHTML='<div class="empty">街ランキングを読み込めませんでした。</div>'}}
async function visitCity(id){try{cityData=await api('/api/cities?id='+id);nav('city')}catch(e){toast(e.message)}}function toast(message){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3600)}
async function refreshLive(){try{let live=await api('/api/live');$('#online').textContent=live.online;liveMessages=[`${live.online} 人が直近5分以内に学習中`,...live.builds.map(x=>`${x.avatar} ${x.name}さんが${S.items[x.item]?.name||'建物'}を建築！`)];let t=$('#liveText');if(t)t.textContent=liveMessages[liveIndex++%liveMessages.length];let c=$('#cityUpdates');if(c)c.innerHTML=live.builds.length?live.builds.map(x=>`<button class="city-rank" data-visit="${x.id}"><span>${esc(x.avatar)}</span><span>${esc(x.name)}さんが${esc(S.items[x.item]?.name||'建物')}を建築</span><span>↗</span></button>`).join(''):'<p class="muted">最初の建築ニュースを待っています。</p>';document.querySelectorAll('#cityUpdates [data-visit]').forEach(b=>b.onclick=()=>visitCity(Number(b.dataset.visit)))}catch(e){}}
async function build(tile){if(!needAccount())return;let existing=S.buildings.find(x=>x.tile===tile),hazard=S.plots.find(x=>x.tile===tile);if(existing){let choices=existing.item==='apartment'||existing.item==='tower'||existing.item==='house'||existing.item==='shop'||existing.item==='convenience'||existing.item==='manor'?'1: 増築 / 2: 改築 / 3: 解体':'2: 改築 / 3: 解体';let answer=prompt(`${S.items[existing.item].name}（${existing.floors}階・${existing.style}）\n${choices}\n番号を入力してください`);if(!answer)return;if(answer==='1')return cityAction('add_floor',tile);if(answer==='3'){if(confirm('解体にはコインがかかります。解体しますか？'))return cityAction('demolish',tile);return}if(answer==='2'){let style=prompt('建築様式を選んでください：'+S.styles.join(' / '),existing.style);if(style)return cityAction('renovate',tile,style)}return}if(hazard&&hazard.hazard==='survey'&&new Date(hazard.ready_at)>new Date())return toast('調査中です。約3分後に建築できます');if(hazard&&hazard.hazard==='heritage')return cityAction('survey',tile);if(hazard&&hazard.hazard==='underground')return cityAction('clear_obstruction',tile);try{let name=S.items[chosenItem].name;await api('/api/build',{item:chosenItem,tile});await load();toast('🏗️ '+name+'が完成！ 街が発展しました');refreshLive()}catch(e){$('#cityError').textContent=e.message}}
async function cityAction(action,tile,style){if(!needAccount())return;try{let r=await api('/api/city-action',{action,tile,style:style||$('#roadStyle')?.value});await load();toast('✨ '+r.message+' −'+r.cost+' ◈')}catch(e){let el=$('#cityError');if(el)el.textContent=e.message;else toast(e.message)}}
function profileView(){let m=S.me;if(!m)return hero('YOUR PROFILE','プロフィール','アカウントを作成して、学習記録を保存しよう。')+'<div class="card panel"><button class="button" id="join">無料アカウントを作る</button></div>';return hero('YOUR PROFILE','あなたらしく、挑戦しよう。','表示名とアバターを決めて、ランキングへの参加を選べます。')+`<div class="profile-wrap"><div class="card panel"><h3>${esc(m.avatar)} プロフィール編集</h3><div class="field"><label>表示名（実名や連絡先は使わないでください）</label><input id="displayName" maxlength="18" value="${esc(m.displayName)}"></div><div class="field" style="margin-top:13px"><label>都道府県</label><select id="prefecture"><option value="">選択しない</option>${S.prefectures.map(x=>`<option ${m.prefecture===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:13px"><label>立場</label><select id="role">${S.roles.map(x=>`<option ${m.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:13px"><label>年代（公開されません）</label><select id="ageBand">${S.ages.map(x=>`<option ${m.ageBand===x?'selected':''}>${x}</option>`).join('')}</select></div><p style="font-size:12px;margin:16px 0 8px">アバター</p><div class="avatar-picker">${S.avatars.map(x=>`<button class="avatar-choice ${m.avatar===x?'on':''}" data-avatar="${x}">${x}</button>`).join('')}</div><label class="check" style="margin:17px 0"><input type="checkbox" id="publicRank" ${m.publicRank?'checked':''}>表示名・アバター・都道府県・立場・点数をランキングに公開する</label><label class="check" style="margin:11px 0"><input type="checkbox" id="publicCity" ${m.publicCity?'checked':''}>自分の街と街ランキングに表示名・アバター・都道府県を公開する</label><label class="check"><input type="checkbox" id="profileGuardian">15歳以下の場合、保護者と確認して利用します</label><p class="alert" id="profileError"></p><button class="button dark" id="saveProfile">保存する</button></div><div class="card panel"><h3>スタディカード</h3><div style="background:#eef5e6;border-radius:14px;padding:22px;text-align:center"><div style="font-size:58px">${esc(m.avatar)}</div><h2>${esc(m.displayName)}</h2><p>${esc(m.prefecture||'全国')} · ${esc(m.role)}</p><div style="font-size:25px;font-weight:800">${m.points} pt</div></div><p class="hint" style="margin-top:22px">ログインID：${esc(m.login)}<br>パスワード再設定機能は現在ありません。</p>${m.testBuilder?`<div class="notice">テスト用コイン無制限：${esc(new Date(m.testUntil).toLocaleString('ja-JP'))}まで。学習順位点は通常どおりです。</div>`:`<div class="field" style="margin-top:20px"><label>テスト用コード（管理者のみ）</label><input id="testCode" autocomplete="off" placeholder="コードを入力"></div><button class="button ghost small" id="claimTest">24時間のテスト用コインを有効にする</button>`}<button class="button ghost" id="logout">ログアウト</button><button class="linkbtn" id="deleteAccount" style="color:#bd5b4f">アカウントと記録を削除</button></div></div>`}
async function saveProfile(){try{await api('/api/profile',{displayName:$('#displayName').value,prefecture:$('#prefecture').value,role:$('#role').value,ageBand:$('#ageBand').value,avatar:document.querySelector('.avatar-choice.on')?.dataset.avatar||'🏠',publicRank:$('#publicRank').checked,publicCity:$('#publicCity').checked,guardian:$('#profileGuardian').checked});await load()}catch(e){$('#profileError').textContent=e.message}}
function newsView(){return hero('EXAM UPDATES','試験ニュース','日程などの情報は、必ず公式発表にリンクして確認できる形で掲載します。')+`<div class="card panel"><h3>公式情報</h3>${S.news.map(n=>`<a class="newslink" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(n.title)} ↗</b><small>${esc(n.date)} · ${esc(n.source)}</small></a>`).join('')}</div><div class="notice">記事は現時点では自動配信ではありません。公式情報を確認し、必要な更新を追加します。</div>`}
function wire(){let join=$('#join');if(join)join.onclick=authPrompt;let daily=$('#startToday');if(daily)daily.onclick=()=>startQuestions(true);let filtered=$('#startFiltered');if(filtered)filtered.onclick=()=>startQuestions(false);document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{rankScope=b.dataset.scope;render()});if(page==='ranking')loadRanks();document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{chosenItem=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>{x.classList.toggle('ghost',x!==b)})});document.querySelectorAll('[data-tile]').forEach(b=>{if(b.getAttribute('aria-disabled')==='true')return;b.onclick=()=>build(Number(b.dataset.tile));b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>cityAction(b.dataset.action));document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});let mine=$('#myCity');if(mine)mine.onclick=()=>{cityData=null;nav('city')};document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{let v=b.dataset.camera;if(v==='left')cityTurn-=25;if(v==='right')cityTurn+=25;if(v==='up')cityTilt=cityTilt===58?42:58;if(v==='reset'){cityTurn=-37;cityTilt=58}let engine=window.City3D?.current;if(v==='fullscreen'){let stage=$('.city-stage');if(document.fullscreenElement)document.exitFullscreen();else stage?.requestFullscreen?.();return}if(v==='night'){if(engine){let night=engine.toggleNight();b.textContent=night?'☀️ 昼景':'🌙 夜景'}return}if(engine&&$('.city-stage')?.classList.contains('is-rendered')){if(v==='left')engine.turn(-25);if(v==='right')engine.turn(25);if(v==='up')engine.tilt();if(v==='reset')engine.reset();return}let ground=$('#cityGround');if(ground){ground.style.setProperty('--turn',cityTurn+'deg');ground.style.setProperty('--tilt',cityTilt+'deg');setTimeout(drawCityIcons,700)}});if(page==='city'){loadCities();refreshLive()}if(page==='home')refreshLive();let save=$('#saveProfile');if(save)save.onclick=saveProfile;let claim=$('#claimTest');if(claim)claim.onclick=async()=>{try{await api('/api/claim-test-builder',{code:$('#testCode').value});await load();toast('テスト用コインが24時間無制限になりました')}catch(e){toast(e.message)}};let logout=$('#logout');if(logout)logout.onclick=async()=>{await api('/api/logout',{});await load()};let del=$('#deleteAccount');if(del)del.onclick=async()=>{let pw=prompt('アカウント・回答記録・街をすべて削除します。確認のためパスワードを入力してください');if(!pw)return;if(!confirm('削除すると元に戻せません。削除しますか？'))return;try{await api('/api/delete-account',{password:pw});await load()}catch(e){$('#profileError').textContent=e.message}}}
load().then(()=>{$('#newAge').innerHTML=S.ages.map(x=>`<option>${x}</option>`).join('')});setInterval(()=>{if(S)refreshQuiet().catch(()=>{})},60000);setInterval(()=>{if(S)refreshLive()},11000);
</script></body></html>
